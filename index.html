    <script src="accounts.js"></script>

    <script>
        //  ==== Constants ====
        // Set to false to disable weather service for working offline and save battery
        var isOnline = true;
        // Kindle Javascript doesn't support timezone so we have to manually add timezone offset.
        var Timezone_Offset = 8;

        // Constants for Weather API: register an free account on https://dev.qweather.com/
        var Weather_Realtime_Url = "https://devapi.qweather.com/v7/weather/now?";
        var Weather_Forecast_Hour_Url = "https://devapi.qweather.com/v7/weather/24h?"
        var Weather_Forecast_Day_Url = "https://devapi.qweather.com/v7/weather/3d?"
        var Weather_Air_Url = "https://devapi.qweather.com/v7/air/now?"
        var Weather_Indices_Url = "https://devapi.qweather.com/v7/indices/1d?"

        // hitokoto API 
        var Hitokoto_Url = "https://v1.hitokoto.cn/?";

        
        // update weather every 30 minutes
        var Weather_Updte_Interval = 30 * 60 * 1000;



        // Global Variables
        var weather_key = qweather_key;
        var lastDateUpdateTime = null;
        var lastWeatherUpdateTime = null;
        var onlineView;
        var offlineView;

        // event handler when document loaded
        $(document).ready(function () {
            onlineView = $("#dailyWeatherBlock").html();
            setOfflineView();
            // load weather key setting
            if (localStorage["qweather_key"] != null) {
                weather_key = localStorage["qweather_key"];
            }
            // first time running, prompt for weather key
            if ((weather_key.indexOf("<") >= 0 || weather_key.length == 0) && localStorage["qweather_key"] == null) {
                setWeatherKey();
            }

            UpdateContentPerMinute();
            setDeepSeekBalanceArea();
            positionFooter();
            $(window).scroll(positionFooter).resize(positionFooter);
        });

        // Update page contents every minute
        function UpdateContentPerMinute() {
            log("UpdateContentPerMinute");
            var now = new Date();

            // manually apply timezone offset.
            if (now.getTimezoneOffset() == 0) {
                now.setHours(now.getHours() + Timezone_Offset);
            }

            // Time area: 实时时间留空不渲染，但保留位置

            // update Date area and poetry every day
            if (lastDateUpdateTime == null || now.getDay() != lastDateUpdateTime.getDay()) {
                setDateArea(now);
              
                lastDateUpdateTime = now;
            }

            // update weather area by Weather_Updte_Interval
            if (lastWeatherUpdateTime == null || (now - lastWeatherUpdateTime) > Weather_Updte_Interval) {
                setWeatherArea();
                lastWeatherUpdateTime = now;
            }
            setPoetryArea();

            // set timer to the next minute
            now = new Date();
            var nextTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes());
            nextTime.setMinutes(nextTime.getMinutes() + 1);
            var diff = nextTime - now;
            setTimeout(UpdateContentPerMinute, diff);
        };

        function getDayName(d) {
            return "星期" + "日一二三四五六".charAt(d);
        }

        function setDateArea(now) {
            log("setDateArea");
            // China Date
            var dateString = now.toLocaleDateString("zh-CN", { dateStyle: 'full' });
            var weekday = getDayName(now.getDay());
            if (dateString.indexOf(weekday) < 0) {
                dateString += weekday;
            }
            $("#dateBlock").text(dateString);

            // Chinese Lunar Calendar（已注释：如需恢复农历日期显示，取消注释即可）
            // var cc = new CalendarConverter;
            // var lunarDate = cc.solar2lunar(new Date(now));
            // var chineseDateString = lunarDate.cYear + "年" + (lunarDate.isLeap ? "闰" : "") + lunarDate.lunarMonth + "月" + lunarDate.lunarDay;
            // $("#chineseDateBlock").text(chineseDateString);
        }

        function setCalendarArea() {
            switchOnline(false);

            var now = new Date();
            // manually apply timezone offset.
            if (now.getTimezoneOffset() == 0) {
                now.setHours(now.getHours() + Timezone_Offset);
            }

            var firstDay = new Date(now);
            var dayOfWeek = now.getDay();
            if (dayOfWeek == 0) dayOfWeek = 7;
            if (dayOfWeek != 1) {
                firstDay.setDate(now.getDate() - dayOfWeek + 1);
            }

            for (var i = 1; i <= 7; i++) {
                var thisDay = new Date(firstDay);
                thisDay.setDate(firstDay.getDate() + (i - 1));
                var prefix = "";
                var suffix = "";
                if (thisDay.getFullYear() == now.getFullYear() && thisDay.getMonth() == now.getMonth() && thisDay.getDate() == now.getDate()) {
                    prefix = "<b>";
                    suffix = "</b>";
                }
                $("#weekDay" + i).html(prefix + (thisDay.getMonth() + 1) + "月" + thisDay.getDate() + "日" + suffix);
                // Chinese Lunar Calendar
                var cc = new CalendarConverter;
                var lunarDate = cc.solar2lunar(new Date(thisDay));
                var chineseDateString = lunarDate.lunarMonth + "月" + lunarDate.lunarDay;
                $("#weekLunarDay" + i).html(prefix + chineseDateString + suffix);
            };
        }

        function setWeatherKey() {
            var key = prompt("请输入Qweather key (免费注册申请：https://dev.qweather.com/)\n按取消键进入省电离线模式。", qweather_key);
            if (key != null && key.length > 0) {
                localStorage["qweather_key"] = key;
            }
            else {
                localStorage["qweather_key"] = "";
            }
            weather_key = localStorage["qweather_key"];
            setWeatherArea();
        }
        function setPoetryArea() {
            log("setHitokotoArea");
            var types = ["a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l"];
            // 随机获取一个句子类型
             var randomIndex = Math.floor(Math.random() * types.length);
             var randomType = types[randomIndex];

            $.get(Hitokoto_Url+"c="+randomType, function (data, status) {
                if (status == "success" && data.hitokoto.length > 0) {
                    // log("hitokoto: " + data.hitokoto + " from: " + data.from);
                    $("#poetryBlock").html(data.hitokoto + "<br />" +"——"+ data.from);
                }
                else {
                    // log("hitokoto failed: " + JSON.stringify(data) + " status: " + status);
                    $("#poetryBlock").text("数据: " + JSON.stringify(data) + "\n状态: " + status);
                }
            }).fail(function() {
                $("#poetryBlock").text("无法获取一言，请检查网络连接。");
            });
        }

        // DeepSeek 余额显示（余额数据由 GitHub Actions 定时更新到 deepseek_balance.json）
        function setDeepSeekBalanceArea() {
            log("setDeepSeekBalanceArea");
            $.getJSON("deepseek_balance.json", function (data) {
                if (data.is_available && data.balance_infos.length > 0) {
                    var balanceInfo = data.balance_infos[0];
                    var totalBalance = parseFloat(balanceInfo.total_balance);
                    var toppedUp = parseFloat(balanceInfo.topped_up_balance);
                    var granted = parseFloat(balanceInfo.granted_balance);
                    if (isNaN(totalBalance)) totalBalance = 0;
                    if (isNaN(toppedUp)) toppedUp = 0;
                    if (isNaN(granted)) granted = 0;
                    var totalText = totalBalance.toFixed(2);

                    // 赠送余额大于0时展示明细，否则隐藏
                    var detailText = "";
                    if (granted > 0 && toppedUp > 0) {
                        detailText = "赠送 ¥" + granted.toFixed(2) + " · 充值 ¥" + toppedUp.toFixed(2);
                    } else if (granted > 0) {
                        detailText = "赠送 ¥" + granted.toFixed(2);
                    } else if (toppedUp > 0) {
                        detailText = "充值 ¥" + toppedUp.toFixed(2);
                    }

                    // 左右布局余额卡片：左侧 DeepSeek 鲸鱼 logo 图片，右侧余额信息
                    $("#deepseekBalanceBlock").html(
                        "<div class='ds-card'>"
                        + "<div class='ds-whale'><span class='ds-whale-emoji'>🐳</span></div>"
                        + "<div class='ds-info'>"
                        + "<div class='ds-brand'><span class='ds-title'>DeepSeek</span><span class='ds-label'>账户余额</span></div>"
                        + "<div class='ds-amount-line'><span class='ds-currency'>¥</span><span class='ds-amount'>" + totalText + "</span></div>"
                        + (detailText ? "<div class='ds-detail'>" + detailText + "</div>" : "")
                        + "</div>"
                        + "</div>"
                    );
                } else {
                    $("#deepseekBalanceBlock").html(
                        "<div class='ds-card'>"
                        + "<div class='ds-whale'><span class='ds-whale-emoji'>🐳</span></div>"
                        + "<div class='ds-info'>"
                        + "<div class='ds-brand'><span class='ds-title'>DeepSeek</span></div>"
                        + "<div class='ds-amount-line ds-error-text'>余额不可用</div>"
                        + "</div>"
                        + "</div>"
                    );
                }
            }).fail(function () {
                $("#deepseekBalanceBlock").html(
                    "<div class='ds-card'>"
                    + "<div class='ds-whale'><span class='ds-whale-emoji'>🐳</span></div>"
                    + "<div class='ds-info'>"
                    + "<div class='ds-brand'><span class='ds-title'>DeepSeek</span></div>"
                    + "<div class='ds-amount-line ds-error-text'>余额待更新</div>"
                    + "</div>"
                    + "</div>"
                );
            });
        }

        function setWeatherArea() {
            log("setWeatherArea");

            // offline mode
            if (weather_key.indexOf("<") >= 0 || weather_key.length == 0) {
                $("#weatherNowBlock").html("");
                $("#weatherInfoBlock").text("离线模式，无天气预报。点击此区域设置。");
                setCalendarArea();
                return;
            }
            else {
                switchOnline(true);
            }
            // Current Weather
            $.get(Weather_Realtime_Url + "key=" + weather_key + "&location=" + weather_location + "&lang=" + weather_lang + "&unit" + weather_unit,
                function (data, status) {
                    if (status == "success" && data.code == "200") {
                        var weather = "<i class='qi-" + data.now.icon + "'></i>"
                            + " " + data.now.text
                            + " <b>" + data.now.temp + "℃</b>"
                            + " 体感" + data.now.feelsLike + "℃"
                            + " " + data.now.windDir + data.now.windScale + "级"
                            + " 湿度" + data.now.humidity + "%"
                            + " 降水" + data.now.precip + "mm/h"
                            + " 能见度" + data.now.vis + "km"
                            ;
                        $("#weatherNowBlock").html(weather);
                        $("#weatherInfoBlock").text("更新时间: " + data.now.obsTime);
                    }
                    else {
                        $("#weatherInfoBlock").text("数据: " + JSON.stringify(data) + "\n状态: " + status);
                    }
                    positionFooter();
                }).fail(function() {
                    // ignore failure
                });

            // Air Quality
            $.get(Weather_Air_Url + "key=" + weather_key + "&location=" + weather_location + "&lang=" + weather_lang + "&unit" + weather_unit,
                function (data, status) {
                    if (status == "success" && data.code == "200") {
                        var now = data.now;
                        // 空气质量纯文字紧凑显示（灰度屏无需彩色徽章图标）
                        $("#airQualityBlock").html(
                            "空气质量: <b>" + now.category + "</b> AQI " + now.aqi
                            + " PM2.5 " + now.pm2p5
                            + " PM10 " + now.pm10
                            + " NO₂ " + now.no2
                            + " SO₂ " + now.so2
                        );
                    } else {
                        $("#airQualityBlock").html("");
                    }
                }).fail(function() {
                    // ignore failure
                    $("#airQualityBlock").html("");
                });

            // Weather Indices (1运动 2洗车 3穿衣 5紫外线)
            $.get(Weather_Indices_Url + "key=" + weather_key + "&location=" + weather_location + "&lang=" + weather_lang + "&type=1,2,3,5",
                function (data, status) {
                    if (status == "success" && data.code == "200" && data.daily.length > 0) {
                        var indexIcons = { "运动": "🏃", "洗车": "🚗", "穿衣": "👔", "紫外线": "☀️" };
                        for (var i = 0; i < data.daily.length; i++) {
                            var idx = data.daily[i];
                            var icon = indexIcons[idx.type] || "✨";
                            // 紧凑单行：图标 + 名称 + 等级
                            $("#index" + i).html(
                                "<span class='index-icon'>" + icon + "</span>"
                                + "<span class='index-name'>" + idx.name + "</span>"
                                + " <span class='index-category'>" + idx.category + "</span>"
                            );
                        }
                    } else {
                        $("#weatherIndicesBlock").html("");
                    }
                }).fail(function() {
                    // ignore failure
                    $("#weatherIndicesBlock").html("");
                });

            // Daily Weather
            $.get(Weather_Forecast_Day_Url + "key=" + weather_key + "&location=" + weather_location + "&lang=" + weather_lang + "&unit" + weather_unit,
                function (data, status) {
                    if (status == "success" && data.code == "200") {
                        for (var i = 0; i < data.daily.length; i++) {
                            dailyData = data.daily[i];
                            var fxDateArray = dailyData.fxDate.split('-');
                            var fxDate = new Date(fxDateArray[0], fxDateArray[1]-1, fxDateArray[2]);
                            // 日期显示（已注释：如需恢复显示几月几日和周几，取消注释即可）
                            // $("#date" + i).html((fxDate.getMonth() + 1) + "月" + fxDate.getDate() + "日" + getDayName(fxDate.getDay()));
                            // 每个格子包含白天和夜间天气（一行3列，每天一列）
                            $("#cell" + i).html("<i class='qi-" + dailyData.iconDay + "'></i>"
                                + " " + dailyData.textDay + " " + dailyData.tempMax + "℃<br/>"
                                + "<i class='qi-" + dailyData.iconNight + "'></i>"
                                + " " + dailyData.textNight + " " + dailyData.tempMin + "℃"
                            );
                        };
                    }
                    else {
                        $("#weatherInfoBlock").text("数据: " + JSON.stringify(data) + "\n状态: " + status);
                    }
                }).fail(function() {
                    $("#weatherInfoBlock").text("无法获取天气预报信息，请检查网络连接和account.js QWeather配置。");
                });
        }

        function trimTitle(s) {
            if (s.length > 20) {
                return s.substring(0, 8) + "..." + s.substring(s.length - 8);
            }
            return s;
        }

        function toggleWeatherArea() {
            if (weather_key.indexOf("<") >= 0 || weather_key.length == 0) {
                setWeatherKey();
                return;
            }
            if (!isOnline) {
                setWeatherArea();
            } else {
                setCalendarArea();
            }
        }

        //定义positionFooter function
        function positionFooter() {
            var offsetHeight = document.getElementById('container').offsetHeight;
            var screenHeight = screen.height;

            if (offsetHeight < screenHeight) {
                document.getElementById("footer").style.position = "fixed";
                document.getElementById("footer").style.bottom = "0";
                document.getElementById("footer").style.left = "0";
                document.getElementById("footer").style.right = "0";
            }
        }

        // fill 0 before digits for fixed length numbers
        function padding0(num, length) {
            for (var len = (num + "").length; len < length; len = num.length) {
                num = "0" + num;
            }
            return num;
        }

        function log(s) {
            console.log(new Date() + " " + s);
        }

        function switchOnline(shouldOnline) {
            isOnline = shouldOnline;
            if (shouldOnline) {
                $("#dailyWeatherBlock").html(onlineView);
            } else {
                $("#dailyWeatherBlock").html(offlineView);
            }
        }

        // workaround for that Kindle web browser doesn't support css visibility:collapse
        function setOfflineView() {
            offlineView = '<table id="weekBlock" align="center" cellpadding="10"> \
                        <tr>\

    </script>

    <style>
        body {
            text-align: center;
        }

        #dateBlock {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        /* 农历日期显示样式（已注释：如需恢复，取消注释即可）
        #chineseDateBlock {
            font-size: 36px;
        }
        */

        #timeBlock {
            padding: 0px;
            margin: 0px;
            border: 0px;
            font-size: 250px;
            font-family: "chesstype";
            /* 实时时间留空，但保留位置 */
            min-height: 290px;
        }
        #poetryBlock {
            text-align: center;
            margin: 0 auto;
            font-size: 36px;
            font-family: "fzxiaktjf";
            color: #333333;
            max-width: 92%;
        }

        /* DeepSeek 余额卡片（左右布局：左大图 + 右信息，NAS 渲染 PNG 灰度图） */
        #deepseekBalanceBlock {
            margin: 8px auto;
            width: 96%;
            max-width: 520px;
        }

        .ds-card {
            display: flex;
            align-items: center;
            border: 1px solid #888888;
            border-radius: 12px;
            background: #ffffff;
            overflow: hidden;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        /* 左侧：大号鲸鱼 emoji（居中显示） */
        .ds-whale {
            flex: 0 0 42%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 0;
        }

        .ds-whale-emoji {
            font-size: 150px;
            line-height: 1;
            display: block;
        }

        /* 右侧：余额信息 */
        .ds-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 14px 16px;

        }

            font-size: 30px;

            margin-left: 6px;
        }

            font-size: 20px;
            color: #777777;
        }

        .ds-error-text {
            font-size: 28px;
            color: #777777;
        }


     

        #weatherNowBlock {
            font-size: 24px;
            color: #000000;
        }

        #weatherInfoBlock {
            font-size: 24px;
            color: #777777;
        }

        .weatherCell {
            font-size: 32px;
        }

        .weeklyCell {
            font-size: 32px;
        }

        /* 分割线统一为灰色 */
        hr {
            border: none;
            border-top: 1px solid #888888;
        }

        /* 天气预报网格（NAS 渲染：一行3列圆角卡片，每天一列，含白天/夜间） */
        .weatherGrid {
            display: grid;

            border-radius: 8px;
            background: #ffffff;
            color: #333333;

        }

            width: 96%;
            margin: 4px auto;
        }

        .indicesGrid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px;
        }

        .indexCell {
            border: 1px solid #cccccc;
            border-radius: 6px;
            background: #ffffff;
            padding: 4px 2px;
            font-size: 20px;
            line-height: 1.3;
            color: #333333;
        }

        .index-icon {
            font-size: 22px;
        }

        .index-name {
            font-size: 20px;
        }

        .index-category {
            font-size: 20px;
            font-weight: bold;
            color: #000000;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id='dateBlock'></div>
        <!-- 农历日期显示元素（已注释：如需恢复，取消注释即可） -->
        <!-- <div id='chineseDateBlock'></div> -->
        <div id='timeBlock' onclick="toggleWeatherArea()"></div>
        <hr />
        <div id='poetryBlock' onclick="setPoetryArea()"></div>
        <hr />
        <!-- DeepSeek 余额显示（数据由 GitHub Actions 定时更新） -->
        <div id='deepseekBalanceBlock'></div>
     
    </div>
    <div id="footer" onclick="setWeatherKey()">
        <hr />
        <div id="dailyWeatherBlock">
            <!-- 原天气表格（已注释：如需恢复显示日期行，取消注释即可）
            <table align="center" cellpadding="10">
                <tr>
                    <td class="weatherCell" id='date0'></td>
                    <td class="weatherCell" id='date1'></td>
                    <td class="weatherCell" id='date2'></td>
                </tr>
                <tr>
                    <td class="weatherCell" id='day0'></td>
                    <td class="weatherCell" id='day1'></td>
                    <td class="weatherCell" id='day2'></td>
                </tr>
                <tr>
                    <td class="weatherCell" id='night0'></td>
                    <td class="weatherCell" id='night1'></td>
                    <td class="weatherCell" id='night2'></td>
                </tr>
            </table>
            -->
            <!-- 天气网格（一行3列圆角卡片：每天一列，包含白天和夜间天气） -->
            <div class="weatherGrid">
                <div class="weatherGridCell" id='cell0'></div>
                <div class="weatherGridCell" id='cell1'></div>
                <div class="weatherGridCell" id='cell2'></div>
            </div>
        </div>
        <hr />
        <!-- 空气质量 -->
        <div id='airQualityBlock'></div>
        <!-- 天气指数 -->
        <div id='weatherIndicesBlock'>
            <div class="indicesGrid">
                <div class="indexCell" id='index0'></div>
                <div class="indexCell" id='index1'></div>
                <div class="indexCell" id='index2'></div>
                <div class="indexCell" id='index3'></div>
            </div>
        </div>
        <hr />
        <div id='weatherNowBlock'></div>
        <div id='weatherInfoBlock'></div>
    </div>
</body>
