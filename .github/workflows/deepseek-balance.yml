name: Update DeepSeek Balance

# 定时更新 DeepSeek 余额（每6小时一次，可根据需要调整 cron）
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  update-balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Query DeepSeek balance
        id: query
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          RESPONSE=$(curl -sS -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            https://api.deepseek.com/user/balance)
          echo "$RESPONSE" > deepseek_balance.json
          echo "Response saved."

      - name: Commit and push balance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deepseek_balance.json
          git diff --cached --quiet || git commit -m "chore: update deepseek balance [skip ci]"
          git push